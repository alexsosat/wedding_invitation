name: boda_ma
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  dio: ^5.9.2
  equatable: ^2.0.5
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_common_classes:
    git:
      url: https://github.com/alexsosat/flutter_common_classes.git
      ref: 1.0.19
  flutter_flavor: ^3.1.3
  flutter_form_builder: ^10.2.0
  flutter_localizations:
    sdk: flutter
  flutter_pretty_dio_logger: ^3.0.0
  form_builder_validators: ^11.2.0
  fpdart: ^1.1.0
  get: ^4.7.3
  gif_view: ^1.0.3
  google_fonts: ^8.0.1
  toastification: ^3.0.3
  turn_page_transition: ^0.5.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/gifs/rings.gif
    - assets/images/texture_1.png
    - assets/images/texture_2.png
    - assets/images/invitation_image.JPG
