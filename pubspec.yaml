name: boda_ma
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  auto_route: ^11.1.0
  cloud_firestore: ^6.9.0
  device_preview_minus: ^1.5.0
  equatable: ^2.1.0
  firebase_auth: ^6.6.0
  firebase_core: ^4.5.0
  firebase_ui_auth: ^3.1.0
  firebase_ui_localizations: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_common_classes:
    git:
      url: https://github.com/alexsosat/flutter_common_classes.git
      ref: 1.1.5
  flutter_flavor: ^3.1.3
  flutter_svg: ^2.3.0
  fpdart: ^1.1.0
  get_it: ^9.2.1
  http: ^1.6.0
  responsive_builder: ^0.7.1
  syncfusion_flutter_xlsio: ^34.2.4
  file_saver: ^0.2.14
  url_launcher: ^6.3.2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  auto_route_generator: ^10.5.0
  rename: ^3.1.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/envelopes/
    - assets/images/frames/
    - assets/images/ribbons/
    - assets/images/seals/
    - assets/images/textures/
    - assets/images/texts/
    - assets/images/logos/
    - assets/images/couple/
    - assets/images/couple/masonry/
    - assets/images/backgrounds/
    - assets/images/symbols/

  fonts:
    - family: GourmetLeFrench
      fonts:
        - asset: assets/fonts/gourmet_le_french.ttf
    - family: GourmetLeFrenchScript
      fonts:
        - asset: assets/fonts/gourmet_le_french_script.ttf
    - family: UntoldHistory
      fonts:
        - asset: assets/fonts/untold_history_Inky.ttf
        - asset: assets/fonts/untold_history_bold_inky.ttf
          weight: 700

flutter_gen:
  output: lib/core/gen
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

icons_launcher:
  platforms:
    android:
      enable: false
    ios:
      enable: false
    web:
      enable: true
      image_path: "assets/images/logos/launcher.png"
      maskable_image_path: "assets/images/logos/launcher.png"
      favicon_path: "assets/images/logos/launcher.png"
      favicon_output_extension: ".png"